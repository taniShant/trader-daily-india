services:
  execution-proxy:
    build:
      context: .
      dockerfile: execution-proxy/Dockerfile
    container_name: oracle-execution-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ORACLE_PROXY_SERVICE_NAME: oracle-execution-proxy
    ports:
      - "${ORACLE_PROXY_PORT:-8080}:8080"

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    container_name: oracle-market-collector
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ORACLE_COLLECTOR_PORT:-8090}:8090"
