version: '3.8'

services:
  trd-bot:
    build:
      context: .
      dockerfile: containers/trading-bot/Dockerfile
    container_name: trd-bot
    restart: unless-stopped
    environment:
      - AWS_REGION=${AWS_REGION:-eu-west-2}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - PAPER_TRADING=${PAPER_TRADING:-true}
      - CAPITAL=${CAPITAL:-100000}
      - ANALYSIS_INTERVAL_SECONDS=${ANALYSIS_INTERVAL_SECONDS:-180}
      - MIN_CONFIDENCE_THRESHOLD=${MIN_CONFIDENCE_THRESHOLD:-70}
      - MAX_DAILY_LOSS_PERCENT=${MAX_DAILY_LOSS_PERCENT:-4}
      - MAX_POSITION_SIZE_PERCENT=${MAX_POSITION_SIZE_PERCENT:-10}
      - WATCHLIST_SIZE=${WATCHLIST_SIZE:-10}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-anthropic.claude-3-haiku-20240307-v1:0}
      - BEDROCK_REGION=${BEDROCK_REGION:-eu-west-2}
      - STATIC_IP=${STATIC_IP:-3.8.245.57}
      - SESSIONS_TABLE=${SESSIONS_TABLE:-svc-trd-sessions-dev}
      - TRADES_TABLE=${TRADES_TABLE:-svc-trd-trades-dev}
      - LEARNING_TABLE=${LEARNING_TABLE:-svc-trd-learning-dev}
      - MARKET_STATE_TABLE=${MARKET_STATE_TABLE:-svc-trd-market-state-dev}
      # Secrets (from .env file, not committed)
      - ICICI_API_KEY=${ICICI_API_KEY}
      - ICICI_SECRET_KEY=${ICICI_SECRET_KEY}
      - ICICI_SESSION_TOKEN=${ICICI_SESSION_TOKEN}
      - NEWS_API_KEY=${NEWS_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    ports:
      - "9090:9090"
    networks:
      - trading-network

  dashboard:
    build:
      context: .
      dockerfile: containers/dashboard/Dockerfile
    container_name: trd-dashboard
    restart: unless-stopped
    environment:
      - AWS_REGION=${AWS_REGION:-eu-west-2}
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - PORT=8080
      - TRADES_TABLE=${TRADES_TABLE:-svc-trd-trades-dev}
      - LEARNING_TABLE=${LEARNING_TABLE:-svc-trd-learning-dev}
      - MARKET_STATE_TABLE=${MARKET_STATE_TABLE:-svc-trd-market-state-dev}
    ports:
      - "8080:8080"
    networks:
      - trading-network
    depends_on:
      - trd-bot

networks:
  trading-network:
    driver: bridge