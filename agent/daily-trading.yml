name: Deploy to ECS Fargate

on:
  push:
    branches: [ main, dev, feature/*, fix/* ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

# Global environment variable for config file (used across jobs)
env:
  CONFIG_FILE: env/${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}.json

jobs:

  # ============================================================
  # JOB 1: Setup and Configuration
  # ============================================================
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      account_id: ${{ steps.config.outputs.account_id }}
      region: ${{ steps.config.outputs.region }}
      ecr_repo: ${{ steps.config.outputs.ecr_repo }}
      ecs_cluster: ${{ steps.config.outputs.ecs_cluster }}
      trading_service: ${{ steps.config.outputs.trading_service }}
      dashboard_service: ${{ steps.config.outputs.dashboard_service }}
      schedule_expression: ${{ steps.config.outputs.schedule_expression }}
      lb_dns_name: ${{ steps.config.outputs.lb_dns_name }}
      private_subnet: ${{ steps.config.outputs.private_subnet }}
      ecs_sg: ${{ steps.config.outputs.ecs_sg }}
      lb_sg: ${{ steps.config.outputs.lb_sg }}
      vpc_id: ${{ steps.config.outputs.vpc_id }}
      tg_name: ${{ steps.config.outputs.tg_name }}
      lb_listener_arn: ${{ steps.config.outputs.lb_listener_arn }}
      task_role_arn: ${{ steps.config.outputs.task_role_arn }}
      execution_role_arn: ${{ steps.config.outputs.execution_role_arn }}
      eventbridge_role_arn: ${{ steps.config.outputs.eventbridge_role_arn }}
      # Trading parameters
      paper_trading: ${{ steps.config.outputs.paper_trading }}
      capital: ${{ steps.config.outputs.capital }}
      analysis_interval: ${{ steps.config.outputs.analysis_interval }}
      min_confidence: ${{ steps.config.outputs.min_confidence }}
      max_daily_loss: ${{ steps.config.outputs.max_daily_loss }}
      max_position_size: ${{ steps.config.outputs.max_position_size }}
      watchlist_size: ${{ steps.config.outputs.watchlist_size }}
      static_ip: ${{ steps.config.outputs.static_ip }}
      bedrock_model: ${{ steps.config.outputs.bedrock_model }}
      # DynamoDB tables
      sessions_table: ${{ steps.config.outputs.sessions_table }}
      trades_table: ${{ steps.config.outputs.trades_table }}
      learning_table: ${{ steps.config.outputs.learning_table }}
      market_state_table: ${{ steps.config.outputs.market_state_table }}
      code_bucket: ${{ steps.config.outputs.code_bucket }}
      # ICICI secrets
      icici_api_key: ${{ steps.config.outputs.icici_api_key }}
      icici_secret_key: ${{ steps.config.outputs.icici_secret_key }}
      icici_session_token: ${{ steps.config.outputs.icici_session_token }}
      news_api_key: ${{ steps.config.outputs.news_api_key }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_NAME="prod"
          else
            ENV_NAME="dev"
          fi
          echo "environment=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "Using environment: $ENV_NAME"
      
      - name: Read config file
        id: config
        run: |
          CONFIG_FILE="env/${{ steps.env.outputs.environment }}.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Config file not found: $CONFIG_FILE"
            exit 1
          fi
          
          # AWS
          echo "account_id=$(jq -r '.aws.account_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "region=$(jq -r '.aws.region' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # ECR
          echo "ecr_repo=$(jq -r '.ecr.repository_name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # ECS
          echo "ecs_cluster=$(jq -r '.ecs.cluster_name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "trading_service=$(jq -r '.ecs.trading_service' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "dashboard_service=$(jq -r '.ecs.dashboard_service' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Scheduled Tasks
          echo "schedule_expression=$(jq -r '.scheduled_tasks.schedule_expression' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Load Balancer
          echo "lb_dns_name=$(jq -r '.load_balancer.dns_name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "lb_listener_arn=$(jq -r '.load_balancer.listener_arn' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "tg_name=$(jq -r '.load_balancer.target_group_name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # IAM
          echo "task_role_arn=$(jq -r '.iam.task_role_arn' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "execution_role_arn=$(jq -r '.iam.execution_role_arn' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "eventbridge_role_arn=$(jq -r '.iam.eventbridge_role_arn' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # VPC
          echo "vpc_id=$(jq -r '.vpc.vpc_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "private_subnet=$(jq -r '.vpc.private_subnet_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Security Groups
          echo "ecs_sg=$(jq -r '.security_groups.ecs_sg_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "lb_sg=$(jq -r '.security_groups.load_balancer_sg_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # S3
          echo "code_bucket=$(jq -r '.s3.code_bucket' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # ICICI
          echo "static_ip=$(jq -r '.icici.static_ip' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "icici_api_key=$(jq -r '.icici.api_key' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "icici_secret_key=$(jq -r '.icici.secret_key' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "icici_session_token=$(jq -r '.icici.session_token' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Trading Parameters
          echo "paper_trading=$(jq -r '.trading.paper_trading' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "capital=$(jq -r '.trading.capital' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "analysis_interval=$(jq -r '.trading.analysis_interval_seconds' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "min_confidence=$(jq -r '.trading.min_confidence_threshold' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "max_daily_loss=$(jq -r '.trading.max_daily_loss_percent' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "max_position_size=$(jq -r '.trading.max_position_size_percent' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "watchlist_size=$(jq -r '.trading.watchlist_size' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # DynamoDB
          echo "sessions_table=$(jq -r '.dynamodb.session_table' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "trades_table=$(jq -r '.dynamodb.trades_table' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "learning_table=$(jq -r '.dynamodb.learning_table' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "market_state_table=$(jq -r '.dynamodb.market_state_table' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Bedrock
          echo "bedrock_model=$(jq -r '.bedrock.model_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # News API
          echo "news_api_key=$(jq -r '.apis.news_api_key' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          echo "✅ Loaded config from $CONFIG_FILE"

  # ============================================================
  # JOB 2: Setup AWS Credentials & Login
  # ============================================================
  aws-setup:
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      ecr_uri: ${{ steps.login.outputs.ecr_uri }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.setup.outputs.region }}
      
      - name: Login to Amazon ECR
        id: login
        run: |
          ECR_URI="${{ needs.setup.outputs.account_id }}.dkr.ecr.${{ needs.setup.outputs.region }}.amazonaws.com/${{ needs.setup.outputs.ecr_repo }}"
          echo "ecr_uri=$ECR_URI" >> $GITHUB_OUTPUT
          aws ecr get-login-password --region ${{ needs.setup.outputs.region }} | \
            docker login --username AWS --password-stdin ${ECR_URI%%/*}

  # ============================================================
  # JOB 3: Build and Push Docker Images
  # ============================================================
  build-images:
    runs-on: ubuntu-latest
    needs: [setup, aws-setup]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build and push Trading Bot image
        run: |
          ECR_URI="${{ needs.aws-setup.outputs.ecr_uri }}"
          docker build -f containers/trading-bot/Dockerfile -t trading-bot:latest .
          docker tag trading-bot:latest ${ECR_URI}:trading-bot-latest
          docker tag trading-bot:latest ${ECR_URI}:trading-bot-${{ github.sha }}
          docker push ${ECR_URI}:trading-bot-latest
          docker push ${ECR_URI}:trading-bot-${{ github.sha }}
          echo "✅ Trading Bot image pushed"
      
      - name: Build and push Dashboard image
        run: |
          ECR_URI="${{ needs.aws-setup.outputs.ecr_uri }}"
          docker build -f containers/dashboard/Dockerfile -t dashboard:latest .
          docker tag dashboard:latest ${ECR_URI}:dashboard-latest
          docker tag dashboard:latest ${ECR_URI}:dashboard-${{ github.sha }}
          docker push ${ECR_URI}:dashboard-latest
          docker push ${ECR_URI}:dashboard-${{ github.sha }}
          echo "✅ Dashboard image pushed"

  # ============================================================
  # JOB 4: Target Group Setup
  # ============================================================
  target-group:
    runs-on: ubuntu-latest
    needs: [setup, aws-setup]
    outputs:
      tg_arn: ${{ steps.create-tg.outputs.tg_arn }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.setup.outputs.region }}
      
      - name: Create or Get Target Group
        id: create-tg
        run: |
          TG_NAME="${{ needs.setup.outputs.tg_name }}"
          VPC_ID="${{ needs.setup.outputs.vpc_id }}"
          LISTENER_ARN="${{ needs.setup.outputs.lb_listener_arn }}"
          
          TG_ARN=$(aws elbv2 describe-target-groups --names $TG_NAME --region ${{ needs.setup.outputs.region }} --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || echo "")
          
          if [ -z "$TG_ARN" ] || [ "$TG_ARN" == "None" ]; then
            echo "Creating target group: $TG_NAME"
            TG_ARN=$(aws elbv2 create-target-group --name $TG_NAME --protocol HTTP --port 8080 --vpc-id $VPC_ID --target-type ip --health-check-path /health --region ${{ needs.setup.outputs.region }} --query 'TargetGroups[0].TargetGroupArn' --output text)
            
            RULE_EXISTS=$(aws elbv2 describe-rules --listener-arn $LISTENER_ARN --region ${{ needs.setup.outputs.region }} --query "Rules[?Conditions[0].Values[0]=='/dashboard*'].RuleArn" --output text)
            if [ -z "$RULE_EXISTS" ]; then
              aws elbv2 create-rule --listener-arn $LISTENER_ARN --conditions Field=path-pattern,Values=/dashboard* --priority 10 --actions Type=forward,TargetGroupArn=$TG_ARN --region ${{ needs.setup.outputs.region }}
            fi
          fi
          echo "tg_arn=$TG_ARN" >> $GITHUB_OUTPUT

  # ============================================================
  # JOB 5: Register Task Definitions
  # ============================================================
  register-tasks:
    runs-on: ubuntu-latest
    needs: [setup, aws-setup]
    outputs:
      trading_task_arn: ${{ steps.trading-task.outputs.task_arn }}
      dashboard_task_arn: ${{ steps.dashboard-task.outputs.task_arn }}
      overnight_task_arn: ${{ steps.overnight-task.outputs.task_arn }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.setup.outputs.region }}
      
      - name: Register Trading Bot Task Definition
        id: trading-task
        run: |
          echo "=== Current directory contents ==="
          ls -la
          echo ""
          echo "=== ecs folder contents (if exists) ==="
          ls -la ecs/ 2>/dev/null || echo "ecs folder not found"
          echo ""
          echo "=== ecs/task-definitions folder contents (if exists) ==="
          ls -la ecs/task-definitions/ 2>/dev/null || echo "ecs/task-definitions folder not found"
          echo ""
          echo "=== Find any json files ==="
          find . -name "*.json" -type f | head -20


          ECR_URI="${{ needs.aws-setup.outputs.ecr_uri }}"
          sed -e "s|PLACEHOLDER_IMAGE|${ECR_URI}:trading-bot-latest|g" \
              -e "s|PLACEHOLDER_REGION|${{ needs.setup.outputs.region }}|g" \
              -e "s|PLACEHOLDER_ENV|${{ needs.setup.outputs.environment }}|g" \
              -e "s|PLACEHOLDER_PAPER_TRADING|${{ needs.setup.outputs.paper_trading }}|g" \
              -e "s|PLACEHOLDER_CAPITAL|${{ needs.setup.outputs.capital }}|g" \
              -e "s|PLACEHOLDER_ANALYSIS_INTERVAL|${{ needs.setup.outputs.analysis_interval }}|g" \
              -e "s|PLACEHOLDER_MIN_CONFIDENCE|${{ needs.setup.outputs.min_confidence }}|g" \
              -e "s|PLACEHOLDER_MAX_DAILY_LOSS|${{ needs.setup.outputs.max_daily_loss }}|g" \
              -e "s|PLACEHOLDER_MAX_POSITION_SIZE|${{ needs.setup.outputs.max_position_size }}|g" \
              -e "s|PLACEHOLDER_WATCHLIST_SIZE|${{ needs.setup.outputs.watchlist_size }}|g" \
              -e "s|PLACEHOLDER_BEDROCK_MODEL|${{ needs.setup.outputs.bedrock_model }}|g" \
              -e "s|PLACEHOLDER_STATIC_IP|${{ needs.setup.outputs.static_ip }}|g" \
              -e "s|PLACEHOLDER_SESSIONS_TABLE|${{ needs.setup.outputs.sessions_table }}|g" \
              -e "s|PLACEHOLDER_TRADES_TABLE|${{ needs.setup.outputs.trades_table }}|g" \
              -e "s|PLACEHOLDER_LEARNING_TABLE|${{ needs.setup.outputs.learning_table }}|g" \
              -e "s|PLACEHOLDER_MARKET_STATE_TABLE|${{ needs.setup.outputs.market_state_table }}|g" \
              -e "s|PLACEHOLDER_CODE_BUCKET|${{ needs.setup.outputs.code_bucket }}|g" \
              -e "s|PLACEHOLDER_ICICI_API_KEY|${{ needs.setup.outputs.icici_api_key }}|g" \
              -e "s|PLACEHOLDER_ICICI_SECRET_KEY|${{ needs.setup.outputs.icici_secret_key }}|g" \
              -e "s|PLACEHOLDER_ICICI_SESSION_TOKEN|${{ needs.setup.outputs.icici_session_token }}|g" \
              -e "s|PLACEHOLDER_NEWS_API_KEY|${{ needs.setup.outputs.news_api_key }}|g" \
              -e "s|PLACEHOLDER_EXECUTION_ROLE_ARN|${{ needs.setup.outputs.execution_role_arn }}|g" \
              -e "s|PLACEHOLDER_TASK_ROLE_ARN|${{ needs.setup.outputs.task_role_arn }}|g" \
              ecs/task-definitions/trading-bot.json > trading-task-resolved.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://trading-task-resolved.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
      
      - name: Register Dashboard Task Definition
        id: dashboard-task
        run: |
          ECR_URI="${{ needs.aws-setup.outputs.ecr_uri }}"
          sed -e "s|PLACEHOLDER_IMAGE|${ECR_URI}:dashboard-latest|g" \
              -e "s|PLACEHOLDER_REGION|${{ needs.setup.outputs.region }}|g" \
              -e "s|PLACEHOLDER_ENV|${{ needs.setup.outputs.environment }}|g" \
              -e "s|PLACEHOLDER_TRADES_TABLE|${{ needs.setup.outputs.trades_table }}|g" \
              -e "s|PLACEHOLDER_LEARNING_TABLE|${{ needs.setup.outputs.learning_table }}|g" \
              -e "s|PLACEHOLDER_MARKET_STATE_TABLE|${{ needs.setup.outputs.market_state_table }}|g" \
              -e "s|PLACEHOLDER_EXECUTION_ROLE_ARN|${{ needs.setup.outputs.execution_role_arn }}|g" \
              -e "s|PLACEHOLDER_TASK_ROLE_ARN|${{ needs.setup.outputs.task_role_arn }}|g" \
              ecs/task-definitions/dashboard.json > dashboard-task-resolved.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://dashboard-task-resolved.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
      
      - name: Register Overnight Analysis Task Definition
        id: overnight-task
        run: |
          ECR_URI="${{ needs.aws-setup.outputs.ecr_uri }}"
          sed -e "s|PLACEHOLDER_IMAGE|${ECR_URI}:trading-bot-latest|g" \
              -e "s|PLACEHOLDER_REGION|${{ needs.setup.outputs.region }}|g" \
              -e "s|PLACEHOLDER_ENV|${{ needs.setup.outputs.environment }}|g" \
              -e "s|PLACEHOLDER_SESSIONS_TABLE|${{ needs.setup.outputs.sessions_table }}|g" \
              -e "s|PLACEHOLDER_TRADES_TABLE|${{ needs.setup.outputs.trades_table }}|g" \
              -e "s|PLACEHOLDER_LEARNING_TABLE|${{ needs.setup.outputs.learning_table }}|g" \
              -e "s|PLACEHOLDER_MARKET_STATE_TABLE|${{ needs.setup.outputs.market_state_table }}|g" \
              -e "s|PLACEHOLDER_CODE_BUCKET|${{ needs.setup.outputs.code_bucket }}|g" \
              -e "s|PLACEHOLDER_NEWS_API_KEY|${{ needs.setup.outputs.news_api_key }}|g" \
              -e "s|PLACEHOLDER_EXECUTION_ROLE_ARN|${{ needs.setup.outputs.execution_role_arn }}|g" \
              -e "s|PLACEHOLDER_TASK_ROLE_ARN|${{ needs.setup.outputs.task_role_arn }}|g" \
              ecs/task-definitions/overnight-analysis.json > overnight-task-resolved.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://overnight-task-resolved.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT

  # ============================================================
  # JOB 6: Create or Update ECS Services
  # ============================================================
  deploy-services:
    runs-on: ubuntu-latest
    needs: [setup, aws-setup, register-tasks, target-group]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.setup.outputs.region }}
      
      - name: Create or Update Trading Bot Service
        run: |
          SERVICE_NAME="${{ needs.setup.outputs.trading_service }}"
          CLUSTER="${{ needs.setup.outputs.ecs_cluster }}"
          TASK_ARN="${{ needs.register-tasks.outputs.trading_task_arn }}"
          PRIVATE_SUBNET="${{ needs.setup.outputs.private_subnet }}"
          ECS_SG="${{ needs.setup.outputs.ecs_sg }}"
          
          if aws ecs describe-services --cluster $CLUSTER --services $SERVICE_NAME --region ${{ needs.setup.outputs.region }} --query "services[?status=='ACTIVE']" --output text | grep -q "$SERVICE_NAME"; then
            echo "Updating existing service: $SERVICE_NAME"
            aws ecs update-service --cluster $CLUSTER --service $SERVICE_NAME --task-definition $TASK_ARN --force-new-deployment --region ${{ needs.setup.outputs.region }}
          else
            echo "Creating new service: $SERVICE_NAME"
            aws ecs create-service --cluster $CLUSTER --service-name $SERVICE_NAME --task-definition $TASK_ARN --desired-count 1 --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET],securityGroups=[$ECS_SG],assignPublicIp=DISABLED}" --region ${{ needs.setup.outputs.region }}
          fi
      
      - name: Create or Update Dashboard Service
        run: |
          SERVICE_NAME="${{ needs.setup.outputs.dashboard_service }}"
          CLUSTER="${{ needs.setup.outputs.ecs_cluster }}"
          TASK_ARN="${{ needs.register-tasks.outputs.dashboard_task_arn }}"
          PRIVATE_SUBNET="${{ needs.setup.outputs.private_subnet }}"
          ECS_SG="${{ needs.setup.outputs.ecs_sg }}"
          TG_ARN="${{ needs.target-group.outputs.tg_arn }}"
          
          if aws ecs describe-services --cluster $CLUSTER --services $SERVICE_NAME --region ${{ needs.setup.outputs.region }} --query "services[?status=='ACTIVE']" --output text | grep -q "$SERVICE_NAME"; then
            echo "Updating existing service: $SERVICE_NAME"
            aws ecs update-service --cluster $CLUSTER --service $SERVICE_NAME --task-definition $TASK_ARN --force-new-deployment --region ${{ needs.setup.outputs.region }}
          else
            echo "Creating new service: $SERVICE_NAME"
            aws ecs create-service --cluster $CLUSTER --service-name $SERVICE_NAME --task-definition $TASK_ARN --desired-count 1 --launch-type FARGATE --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET],securityGroups=[$ECS_SG],assignPublicIp=DISABLED}" --load-balancers "targetGroupArn=$TG_ARN,containerName=dashboard,containerPort=8080" --region ${{ needs.setup.outputs.region }}
          fi

  # ============================================================
  # JOB 7: EventBridge Schedule for Overnight Task
  # ============================================================
  eventbridge-schedule:
    runs-on: ubuntu-latest
    needs: [setup, aws-setup, register-tasks]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ needs.setup.outputs.region }}
      
      - name: Create or Update EventBridge Schedule
        run: |
          RULE_NAME="overnight-analysis-${{ needs.setup.outputs.environment }}"
          EVENTBRIDGE_ROLE_ARN="${{ needs.setup.outputs.eventbridge_role_arn }}"
          CLUSTER="${{ needs.setup.outputs.ecs_cluster }}"
          TASK_ARN="${{ needs.register-tasks.outputs.overnight_task_arn }}"
          PRIVATE_SUBNET="${{ needs.setup.outputs.private_subnet }}"
          ECS_SG="${{ needs.setup.outputs.ecs_sg }}"
          SCHEDULE_EXPR="${{ needs.setup.outputs.schedule_expression }}"
          
          if [ -z "$SCHEDULE_EXPR" ] || [ "$SCHEDULE_EXPR" == "null" ]; then
            echo "⚠️ No schedule expression found. Skipping EventBridge rule creation."
            exit 0
          fi
          
          aws events put-rule --name "$RULE_NAME" --schedule-expression "$SCHEDULE_EXPR" --state ENABLED --region ${{ needs.setup.outputs.region }} || true
          
          RULE_ARN=$(aws events describe-rule --name "$RULE_NAME" --region ${{ needs.setup.outputs.region }} --query 'Arn' --output text 2>/dev/null || echo "")
          
          if [ -n "$RULE_ARN" ]; then
            aws events put-targets --rule "$RULE_NAME" --targets "Id=1,Arn=arn:aws:ecs:${{ needs.setup.outputs.region }}:${{ needs.setup.outputs.account_id }}:cluster/$CLUSTER,RoleArn=$EVENTBRIDGE_ROLE_ARN,EcsParameters={TaskDefinitionArn=$TASK_ARN,LaunchType=FARGATE,NetworkConfiguration={awsvpcConfiguration={Subnets=[$PRIVATE_SUBNET],SecurityGroups=[$ECS_SG],AssignPublicIp=DISABLED}}}" --region ${{ needs.setup.outputs.region }} || true
          fi
          
          echo "✅ EventBridge schedule configured: $RULE_NAME"

  # ============================================================
  # JOB 8: Wait for Stability and Output
  # ============================================================
  finalize:
    runs-on: ubuntu-latest
    needs: [setup, deploy-services, eventbridge-schedule]
    steps:
      - name: Wait for services to stabilize
        run: |
          echo "Waiting for trading bot service..."
          aws ecs wait services-stable --cluster ${{ needs.setup.outputs.ecs_cluster }} --services ${{ needs.setup.outputs.trading_service }} --region ${{ needs.setup.outputs.region }} || true
          echo "Waiting for dashboard service..."
          aws ecs wait services-stable --cluster ${{ needs.setup.outputs.ecs_cluster }} --services ${{ needs.setup.outputs.dashboard_service }} --region ${{ needs.setup.outputs.region }} || true
      
      - name: Output Dashboard URL
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Region: ${{ needs.setup.outputs.region }}"
