name: Deploy to ECS Fargate 

on:
  push:
    branches: [ main, dev, feature/*, fix/* ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # ============================================================
      # SET ENVIRONMENT FROM BRANCH OR INPUT
      # ============================================================
      
      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV_NAME="prod"
          else
            ENV_NAME="dev"
          fi
          echo "environment=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "Using environment: $ENV_NAME"
      
      # ============================================================
      # READ CONFIGURATION FROM JSON FILE
      # ============================================================
      
      - name: Read config file
        id: config
        run: |
          CONFIG_FILE="env/${{ steps.env.outputs.environment }}.json"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Config file not found: $CONFIG_FILE"
            exit 1
          fi
          
          echo "config_file=$CONFIG_FILE" >> $GITHUB_OUTPUT
          
          # AWS
          echo "account_id=$(jq -r '.aws.account_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "region=$(jq -r '.aws.region' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # ECR
          echo "ecr_repo=$(jq -r '.ecr.repository_name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # ECS
          echo "ecs_cluster=$(jq -r '.ecs.cluster_name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "trading_service=$(jq -r '.ecs.trading_service' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "dashboard_service=$(jq -r '.ecs.dashboard_service' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Scheduled Tasks
          echo "overnight_task_family=$(jq -r '.scheduled_tasks.overnight_task_family' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "schedule_expression=$(jq -r '.scheduled_tasks.schedule_expression' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Load Balancer
          echo "lb_arn=$(jq -r '.load_balancer.arn' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "lb_dns_name=$(jq -r '.load_balancer.dns_name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "lb_listener_arn=$(jq -r '.load_balancer.listener_arn' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "tg_name=$(jq -r '.load_balancer.target_group_name' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # IAM
          echo "task_role_arn=$(jq -r '.iam.task_role_arn' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "execution_role_arn=$(jq -r '.iam.execution_role_arn' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # VPC
          echo "vpc_id=$(jq -r '.vpc.vpc_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "public_subnet=$(jq -r '.vpc.public_subnet_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "private_subnet=$(jq -r '.vpc.private_subnet_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Security Groups
          echo "ecs_sg=$(jq -r '.security_groups.ecs_sg_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "lb_sg=$(jq -r '.security_groups.load_balancer_sg_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # S3
          echo "code_bucket=$(jq -r '.s3.code_bucket' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # ICICI
          echo "static_ip=$(jq -r '.icici.static_ip' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Trading Parameters
          echo "paper_trading=$(jq -r '.trading.paper_trading' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "capital=$(jq -r '.trading.capital' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "analysis_interval=$(jq -r '.trading.analysis_interval_seconds' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "min_confidence=$(jq -r '.trading.min_confidence_threshold' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "max_daily_loss=$(jq -r '.trading.max_daily_loss_percent' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "max_position_size=$(jq -r '.trading.max_position_size_percent' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "watchlist_size=$(jq -r '.trading.watchlist_size' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # DynamoDB
          echo "sessions_table=$(jq -r '.dynamodb.session_table' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "trades_table=$(jq -r '.dynamodb.trades_table' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "learning_table=$(jq -r '.dynamodb.learning_table' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          echo "market_state_table=$(jq -r '.dynamodb.market_state_table' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          # Bedrock
          echo "bedrock_model=$(jq -r '.bedrock.model_id' $CONFIG_FILE)" >> $GITHUB_OUTPUT
          
          echo "✅ Loaded config from $CONFIG_FILE"
      
      # ============================================================
      # CONFIGURE AWS CREDENTIALS
      # ============================================================
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.config.outputs.region }}
      
      # ============================================================
      # LOGIN TO ECR
      # ============================================================
      
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ steps.config.outputs.region }} | \
            docker login --username AWS --password-stdin ${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com
      
      # ============================================================
      # CREATE OR GET TARGET GROUP
      # ============================================================
      
      - name: Create or Get Target Group
        id: target-group
        run: |
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names ${{ steps.config.outputs.tg_name }} \
            --region ${{ steps.config.outputs.region }} \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$TG_ARN" ] || [ "$TG_ARN" == "None" ]; then
            echo "Creating target group: ${{ steps.config.outputs.tg_name }}"
            TG_ARN=$(aws elbv2 create-target-group \
              --name ${{ steps.config.outputs.tg_name }} \
              --protocol HTTP \
              --port 8080 \
              --vpc-id ${{ steps.config.outputs.vpc_id }} \
              --target-type ip \
              --health-check-path /health \
              --health-check-interval-seconds 30 \
              --healthy-threshold-count 2 \
              --unhealthy-threshold-count 2 \
              --region ${{ steps.config.outputs.region }} \
              --query 'TargetGroups[0].TargetGroupArn' \
              --output text)
            
            echo "Created target group: $TG_ARN"
            
            RULE_EXISTS=$(aws elbv2 describe-rules \
              --listener-arn ${{ steps.config.outputs.lb_listener_arn }} \
              --region ${{ steps.config.outputs.region }} \
              --query "Rules[?Conditions[0].Values[0]=='/dashboard*'].RuleArn" \
              --output text)
            
            if [ -z "$RULE_EXISTS" ]; then
              aws elbv2 create-rule \
                --listener-arn ${{ steps.config.outputs.lb_listener_arn }} \
                --conditions Field=path-pattern,Values=/dashboard* \
                --priority 10 \
                --actions Type=forward,TargetGroupArn=$TG_ARN \
                --region ${{ steps.config.outputs.region }}
              echo "Created listener rule for /dashboard*"
            else
              echo "Listener rule already exists"
            fi
          else
            echo "Target group already exists: $TG_ARN"
          fi
          
          echo "tg_arn=$TG_ARN" >> $GITHUB_OUTPUT
      
      # ============================================================
      # BUILD AND PUSH TRADING BOT IMAGE
      # ============================================================
      
      - name: Build and push Trading Bot image
        run: |
          ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          
          docker build -f containers/trading-bot/Dockerfile -t trading-bot:latest .
          docker tag trading-bot:latest ${ECR_URI}:trading-bot-latest
          docker tag trading-bot:latest ${ECR_URI}:trading-bot-${{ github.sha }}
          
          docker push ${ECR_URI}:trading-bot-latest
          docker push ${ECR_URI}:trading-bot-${{ github.sha }}
          
          echo "✅ Trading Bot image pushed"
      
      # ============================================================
      # BUILD AND PUSH DASHBOARD IMAGE
      # ============================================================
      
      - name: Build and push Dashboard image
        run: |
          ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          
          docker build -f containers/dashboard/Dockerfile -t dashboard:latest .
          docker tag dashboard:latest ${ECR_URI}:dashboard-latest
          docker tag dashboard:latest ${ECR_URI}:dashboard-${{ github.sha }}
          
          docker push ${ECR_URI}:dashboard-latest
          docker push ${ECR_URI}:dashboard-${{ github.sha }}
          
          echo "✅ Dashboard image pushed"
      
      # ============================================================
      # REGISTER TRADING BOT TASK DEFINITION (from JSON template)
      # ============================================================
      
      - name: Register Trading Bot Task Definition
        id: register-trading-task
        run: |
          ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          
          # Read template and replace placeholders
          sed -e "s|PLACEHOLDER_IMAGE|${ECR_URI}:trading-bot-latest|g" \
              -e "s|PLACEHOLDER_REGION|${{ steps.config.outputs.region }}|g" \
              -e "s|PLACEHOLDER_ENV|${{ steps.env.outputs.environment }}|g" \
              -e "s|PLACEHOLDER_PAPER_TRADING|${{ steps.config.outputs.paper_trading }}|g" \
              -e "s|PLACEHOLDER_CAPITAL|${{ steps.config.outputs.capital }}|g" \
              -e "s|PLACEHOLDER_ANALYSIS_INTERVAL|${{ steps.config.outputs.analysis_interval }}|g" \
              -e "s|PLACEHOLDER_MIN_CONFIDENCE|${{ steps.config.outputs.min_confidence }}|g" \
              -e "s|PLACEHOLDER_MAX_DAILY_LOSS|${{ steps.config.outputs.max_daily_loss }}|g" \
              -e "s|PLACEHOLDER_MAX_POSITION_SIZE|${{ steps.config.outputs.max_position_size }}|g" \
              -e "s|PLACEHOLDER_WATCHLIST_SIZE|${{ steps.config.outputs.watchlist_size }}|g" \
              -e "s|PLACEHOLDER_BEDROCK_MODEL|${{ steps.config.outputs.bedrock_model }}|g" \
              -e "s|PLACEHOLDER_BEDROCK_REGION|${{ steps.config.outputs.region }}|g" \
              -e "s|PLACEHOLDER_STATIC_IP|${{ steps.config.outputs.static_ip }}|g" \
              -e "s|PLACEHOLDER_SESSIONS_TABLE|${{ steps.config.outputs.sessions_table }}|g" \
              -e "s|PLACEHOLDER_TRADES_TABLE|${{ steps.config.outputs.trades_table }}|g" \
              -e "s|PLACEHOLDER_LEARNING_TABLE|${{ steps.config.outputs.learning_table }}|g" \
              -e "s|PLACEHOLDER_MARKET_STATE_TABLE|${{ steps.config.outputs.market_state_table }}|g" \
              -e "s|PLACEHOLDER_CODE_BUCKET|${{ steps.config.outputs.code_bucket }}|g" \
              -e "s|PLACEHOLDER_ICICI_API_KEY|${{ steps.config.outputs.icici_api_key }}|g" \
              -e "s|PLACEHOLDER_ICICI_SECRET_KEY|${{ steps.config.outputs.icici_secret_key }}|g" \
              -e "s|PLACEHOLDER_ICICI_SESSION_TOKEN|${{ steps.config.outputs.icici_session_token }}|g" \
              -e "s|PLACEHOLDER_NEWS_API_KEY|${{ steps.config.outputs.news_api_key }}|g" \
              -e "s|PLACEHOLDER_EXECUTION_ROLE_ARN|${{ steps.config.outputs.execution_role_arn }}|g" \
              -e "s|PLACEHOLDER_TASK_ROLE_ARN|${{ steps.config.outputs.task_role_arn }}|g" \
              ecs/task-definitions/trading-bot.json > trading-task-resolved.json
          
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://trading-task-resolved.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✅ Registered trading bot task definition: $TASK_ARN"
      
      # ============================================================
      # CREATE OR UPDATE TRADING BOT SERVICE
      # ============================================================
      
      # - name: Create or Update Trading Bot Service
      #   run: |
      #     if aws ecs describe-services \
      #       --cluster ${{ steps.config.outputs.ecs_cluster }} \
      #       --services ${{ steps.config.outputs.trading_service }} \
      #       --region ${{ steps.config.outputs.region }} \
      #       --query "services[?serviceName=='${{ steps.config.outputs.trading_service }}']" \
      #       --output text | grep -q "serviceName"; then
      #       echo "Updating existing service: ${{ steps.config.outputs.trading_service }}"
      #       aws ecs update-service \
      #         --cluster ${{ steps.config.outputs.ecs_cluster }} \
      #         --service ${{ steps.config.outputs.trading_service }} \
      #         --task-definition ${{ steps.register-trading-task.outputs.task_arn }} \
      #         --force-new-deployment \
      #         --region ${{ steps.config.outputs.region }}
      #     else
      #       echo "Creating new service: ${{ steps.config.outputs.trading_service }}"
      #       aws ecs create-service \
      #         --cluster ${{ steps.config.outputs.ecs_cluster }} \
      #         --service-name ${{ steps.config.outputs.trading_service }} \
      #         --task-definition ${{ steps.register-trading-task.outputs.task_arn }} \
      #         --desired-count 1 \
      #         --launch-type FARGATE \
      #         --network-configuration "awsvpcConfiguration={subnets=[${{ steps.config.outputs.private_subnet }}],securityGroups=[${{ steps.config.outputs.ecs_sg }}],assignPublicIp=DISABLED}" \
      #         --region ${{ steps.config.outputs.region }}
      #     fi

      - name: Create or Update Trading Bot Service
        run: |
          # Check if service exists using describe-services
          if aws ecs describe-services \
            --cluster ${{ steps.config.outputs.ecs_cluster }} \
            --services ${{ steps.config.outputs.trading_service }} \
            --region ${{ steps.config.outputs.region }} \
            --query "services[?status=='ACTIVE' || status=='INACTIVE']" \
            --output text | grep -q "${{ steps.config.outputs.trading_service }}"; then
            
            echo "Updating existing service: ${{ steps.config.outputs.trading_service }}"
            aws ecs update-service \
              --cluster ${{ steps.config.outputs.ecs_cluster }} \
              --service ${{ steps.config.outputs.trading_service }} \
              --task-definition ${{ steps.register-trading-task.outputs.task_arn }} \
              --force-new-deployment \
              --region ${{ steps.config.outputs.region }}
          else
            echo "Creating new service: ${{ steps.config.outputs.trading_service }}"
            aws ecs create-service \
              --cluster ${{ steps.config.outputs.ecs_cluster }} \
              --service-name ${{ steps.config.outputs.trading_service }} \
              --task-definition ${{ steps.register-trading-task.outputs.task_arn }} \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[${{ steps.config.outputs.private_subnet }}],securityGroups=[${{ steps.config.outputs.ecs_sg }}],assignPublicIp=DISABLED}" \
              --region ${{ steps.config.outputs.region }}
          fi
      
      # ============================================================
      # REGISTER DASHBOARD TASK DEFINITION (from JSON template)
      # ============================================================
      
      - name: Register Dashboard Task Definition
        id: register-dashboard-task
        run: |
          ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          
          sed -e "s|PLACEHOLDER_IMAGE|${ECR_URI}:dashboard-latest|g" \
              -e "s|PLACEHOLDER_REGION|${{ steps.config.outputs.region }}|g" \
              -e "s|PLACEHOLDER_ENV|${{ steps.env.outputs.environment }}|g" \
              -e "s|PLACEHOLDER_TRADES_TABLE|${{ steps.config.outputs.trades_table }}|g" \
              -e "s|PLACEHOLDER_LEARNING_TABLE|${{ steps.config.outputs.learning_table }}|g" \
              -e "s|PLACEHOLDER_MARKET_STATE_TABLE|${{ steps.config.outputs.market_state_table }}|g" \
              -e "s|PLACEHOLDER_EXECUTION_ROLE_ARN|${{ steps.config.outputs.execution_role_arn }}|g" \
              -e "s|PLACEHOLDER_TASK_ROLE_ARN|${{ steps.config.outputs.task_role_arn }}|g" \
              ecs/task-definitions/dashboard.json > dashboard-task-resolved.json
          
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://dashboard-task-resolved.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✅ Registered dashboard task definition: $TASK_ARN"
      
      # ============================================================
      # CREATE OR UPDATE DASHBOARD SERVICE (with Load Balancer)
      # ============================================================
      
      # - name: Create or Update Dashboard Service
      #   run: |
      #     if aws ecs describe-services \
      #       --cluster ${{ steps.config.outputs.ecs_cluster }} \
      #       --services ${{ steps.config.outputs.dashboard_service }} \
      #       --region ${{ steps.config.outputs.region }} \
      #       --query "services[?serviceName=='${{ steps.config.outputs.dashboard_service }}']" \
      #       --output text | grep -q "serviceName"; then
      #       echo "Updating existing service: ${{ steps.config.outputs.dashboard_service }}"
      #       aws ecs update-service \
      #         --cluster ${{ steps.config.outputs.ecs_cluster }} \
      #         --service ${{ steps.config.outputs.dashboard_service }} \
      #         --task-definition ${{ steps.register-dashboard-task.outputs.task_arn }} \
      #         --force-new-deployment \
      #         --region ${{ steps.config.outputs.region }}
      #     else
      #       echo "Creating new service: ${{ steps.config.outputs.dashboard_service }}"
      #       aws ecs create-service \
      #         --cluster ${{ steps.config.outputs.ecs_cluster }} \
      #         --service-name ${{ steps.config.outputs.dashboard_service }} \
      #         --task-definition ${{ steps.register-dashboard-task.outputs.task_arn }} \
      #         --desired-count 1 \
      #         --launch-type FARGATE \
      #         --network-configuration "awsvpcConfiguration={subnets=[${{ steps.config.outputs.public_subnet }}],securityGroups=[${{ steps.config.outputs.lb_sg }}],assignPublicIp=ENABLED}" \
      #         --load-balancers "targetGroupArn=${{ steps.target-group.outputs.tg_arn }},containerName=dashboard,containerPort=8080" \
      #         --region ${{ steps.config.outputs.region }}
      #     fi

      - name: Create or Update Dashboard Service
        run: |
          # Check if service exists using describe-services
          if aws ecs describe-services \
            --cluster ${{ steps.config.outputs.ecs_cluster }} \
            --services ${{ steps.config.outputs.dashboard_service }} \
            --region ${{ steps.config.outputs.region }} \
            --query "services[?status=='ACTIVE' || status=='INACTIVE']" \
            --output text | grep -q "${{ steps.config.outputs.dashboard_service }}"; then
            
            echo "Updating existing service: ${{ steps.config.outputs.dashboard_service }}"
            aws ecs update-service \
              --cluster ${{ steps.config.outputs.ecs_cluster }} \
              --service ${{ steps.config.outputs.dashboard_service }} \
              --task-definition ${{ steps.register-trading-task.outputs.task_arn }} \
              --force-new-deployment \
              --region ${{ steps.config.outputs.region }}
          else
            echo "Creating new service: ${{ steps.config.outputs.dashboard_service }}"
            aws ecs create-service \
              --cluster ${{ steps.config.outputs.ecs_cluster }} \
              --service-name ${{ steps.config.outputs.dashboard_service }} \
              --task-definition ${{ steps.register-trading-task.outputs.task_arn }} \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[${{ steps.config.outputs.private_subnet }}],securityGroups=[${{ steps.config.outputs.ecs_sg }}],assignPublicIp=DISABLED}" \
              --region ${{ steps.config.outputs.region }}
          fi
              
      
      # ============================================================
      # REGISTER OVERNIGHT ANALYSIS TASK (from JSON template)
      # ============================================================
      
      - name: Register Overnight Analysis Task Definition
        id: register-overnight-task
        run: |
          ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          
          sed -e "s|PLACEHOLDER_IMAGE|${ECR_URI}:trading-bot-latest|g" \
              -e "s|PLACEHOLDER_REGION|${{ steps.config.outputs.region }}|g" \
              -e "s|PLACEHOLDER_ENV|${{ steps.env.outputs.environment }}|g" \
              -e "s|PLACEHOLDER_SESSIONS_TABLE|${{ steps.config.outputs.sessions_table }}|g" \
              -e "s|PLACEHOLDER_TRADES_TABLE|${{ steps.config.outputs.trades_table }}|g" \
              -e "s|PLACEHOLDER_LEARNING_TABLE|${{ steps.config.outputs.learning_table }}|g" \
              -e "s|PLACEHOLDER_MARKET_STATE_TABLE|${{ steps.config.outputs.market_state_table }}|g" \
              -e "s|PLACEHOLDER_CODE_BUCKET|${{ steps.config.outputs.code_bucket }}|g" \
              -e "s|PLACEHOLDER_NEWS_API_KEY|${{ secrets.NEWS_API_KEY }}|g" \
              -e "s|PLACEHOLDER_EXECUTION_ROLE_ARN|${{ steps.config.outputs.execution_role_arn }}|g" \
              -e "s|PLACEHOLDER_TASK_ROLE_ARN|${{ steps.config.outputs.task_role_arn }}|g" \
              ecs/task-definitions/overnight-analysis.json > overnight-task-resolved.json
          
          TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://overnight-task-resolved.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "✅ Registered overnight analysis task definition: $TASK_ARN"
      
      # ============================================================
      # CREATE OR UPDATE EVENTBRIDGE SCHEDULE FOR OVERNIGHT TASK
      # ============================================================
      - name: Create or Update EventBridge Schedule
        run: |
          RULE_NAME="overnight-analysis-${{ steps.env.outputs.environment }}"
          CONFIG_FILE="env/${{ steps.env.outputs.environment }}.json"
          
          # Get EventBridge role ARN from config
          EVENTBRIDGE_ROLE_ARN=$(jq -r '.iam.eventbridge_role_arn' "$CONFIG_FILE")
          
          # Create or update the rule
          aws events put-rule \
            --name "$RULE_NAME" \
            --schedule-expression "${{ steps.config.outputs.schedule_expression }}" \
            --state ENABLED \
            --region ${{ steps.config.outputs.region }} || true
          
          # Get the rule ARN
          RULE_ARN=$(aws events describe-rule \
            --name "$RULE_NAME" \
            --region ${{ steps.config.outputs.region }} \
            --query 'Arn' \
            --output text 2>/dev/null || echo "")
          
          if [ -n "$RULE_ARN" ]; then
            # Add target (ECS task) to the rule with RoleArn
            aws events put-targets \
              --rule "$RULE_NAME" \
              --targets "Id=1,Arn=arn:aws:ecs:${{ steps.config.outputs.region }}:${{ steps.config.outputs.account_id }}:cluster/${{ steps.config.outputs.ecs_cluster }},RoleArn=$EVENTBRIDGE_ROLE_ARN,EcsParameters={TaskDefinitionArn=${{ steps.register-overnight-task.outputs.task_arn }},LaunchType=FARGATE,NetworkConfiguration={awsvpcConfiguration={Subnets=[${{ steps.config.outputs.private_subnet }}],SecurityGroups=[${{ steps.config.outputs.ecs_sg }}],AssignPublicIp=DISABLED}}}" \
              --region ${{ steps.config.outputs.region }} || true
          fi
          
          echo "✅ EventBridge schedule configured: $RULE_NAME"
      
      # ============================================================
      # WAIT FOR SERVICES TO STABILIZE
      # ============================================================
      
      - name: Wait for services to stabilize
        run: |
          echo "Waiting for trading bot service..."
          aws ecs wait services-stable \
            --cluster ${{ steps.config.outputs.ecs_cluster }} \
            --services ${{ steps.config.outputs.trading_service }} \
            --region ${{ steps.config.outputs.region }} || true
          
          echo "Waiting for dashboard service..."
          aws ecs wait services-stable \
            --cluster ${{ steps.config.outputs.ecs_cluster }} \
            --services ${{ steps.config.outputs.dashboard_service }} \
            --region ${{ steps.config.outputs.region }} || true
      
      # ============================================================
      # OUTPUT DASHBOARD URL
      # ============================================================
      
      - name: Output Dashboard URL
        run: |
          echo "=========================================="
          echo "✅ DEPLOYMENT COMPLETE"
          echo "=========================================="
          echo "Environment: ${{ steps.env.outputs.environment }}"
