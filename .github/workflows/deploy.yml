name: Deploy AWS Trading System

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: prod
        type: choice
        options:
          - prod
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

env:
  CDK_DEPLOY_ENV: prod

jobs:
  deploy-aws:
    name: Build images and deploy CDK
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "CDK_DEPLOY_ENV=${{ github.event.inputs.environment }}" >> "$GITHUB_ENV"
          fi

      - name: Read AWS config
        id: config
        run: |
          CONFIG_FILE="cicd/env/${CDK_DEPLOY_ENV}.json"
          echo "config_file=${CONFIG_FILE}" >> "$GITHUB_OUTPUT"
          echo "account_id=$(jq -r '.aws.account_id' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "region=$(jq -r '.aws.region' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "ecr_repo=$(jq -r '.ecr.repository_name' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.region }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ steps.config.outputs.region }}" | \
            docker login --username AWS --password-stdin \
            "${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com"

      - name: Build and push trading bot image
        run: |
          ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          docker build -f containers/trading-bot/Dockerfile -t "${ECR_URI}:trading-bot-latest" .
          docker push "${ECR_URI}:trading-bot-latest"

      - name: Build and push dashboard image
        run: |
          ECR_URI="${{ steps.config.outputs.account_id }}.dkr.ecr.${{ steps.config.outputs.region }}.amazonaws.com/${{ steps.config.outputs.ecr_repo }}"
          docker build -f containers/dashboard/Dockerfile -t "${ECR_URI}:dashboard-latest" .
          docker push "${ECR_URI}:dashboard-latest"

      - name: Install CDK dependencies
        run: |
          npm install -g aws-cdk
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate deploy path
        run: python scripts/verify_deploy_path.py

      - name: CDK synth
        run: cdk synth

      - name: CDK deploy
        run: cdk deploy --all --require-approval never
