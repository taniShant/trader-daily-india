name: Deploy Oracle Services

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print deployment steps without connecting to Oracle
        required: true
        default: true
        type: boolean
      proxy_mode:
        description: Oracle execution proxy mode
        required: true
        default: mock
        type: choice
        options:
          - mock
          - live
      collector_mode:
        description: Oracle collector mode
        required: true
        default: mock
        type: choice
        options:
          - mock

permissions:
  contents: read

jobs:
  deploy-oracle:
    name: Deploy Oracle proxy and collector
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        if: github.event.inputs.dry_run != 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Deploy Oracle services
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST || '80.225.242.6' }}
          ORACLE_USER: ${{ secrets.ORACLE_USER || 'opc' }}
          ORACLE_SSH_KEY: ~/.ssh/oracle_key
          ORACLE_PROXY_SHARED_SECRET: ${{ secrets.ORACLE_PROXY_SHARED_SECRET }}
          ORACLE_PROXY_MODE: ${{ github.event.inputs.proxy_mode }}
          ORACLE_COLLECTOR_MODE: ${{ github.event.inputs.collector_mode }}
          ICICI_API_KEY: ${{ secrets.ICICI_API_KEY }}
          ICICI_SECRET_KEY: ${{ secrets.ICICI_SECRET_KEY }}
          ICICI_SESSION_TOKEN: ${{ secrets.ICICI_SESSION_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            oracle/scripts/deploy_oracle_services.sh --dry-run
          else
            oracle/scripts/deploy_oracle_services.sh
          fi
