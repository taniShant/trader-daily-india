name: Daily Trading Runtime Guard

on:
  workflow_dispatch:

jobs:
  runtime-guard:
    name: Runtime is owned by ECS
    runs-on: ubuntu-latest
    steps:
      - name: Explain active runtime
        run: |
          echo "The active daily trading runtime is the AWS ECS trading-bot service deployed by CDK."
          echo "This workflow intentionally does not invoke AgentCore or place/analyze trades."
          echo "Schedules will be added through CDK/EventBridge in P2-WP06."
